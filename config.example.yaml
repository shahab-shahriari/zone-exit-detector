# Copy to config.yaml and adjust.
detector:
  type: motion            # "motion" needs no model; "yolo" uses Ultralytics YOLO
  motion:
    min_area: 1500        # ignore moving blobs smaller than this many pixels
  yolo:
    weights: yolov8n.pt
    conf: 0.3
    iou: 0.5
    classes: [2, 5, 7]    # COCO ids: car, bus, truck
    device: auto

zone_file: zone.json      # created with: python -m zone_exit zone --source <video>

rule:
  direction: left_to_right   # any | left_to_right | right_to_left | top_to_bottom | bottom_to_top
  min_distance_px: 40        # how far the vehicle must move from where it entered the zone
  min_time_in_zone_s: 0.5    # ignore very short appearances (flicker, false positives)

tracker:
  iou_threshold: 0.3
  max_age: 15                # frames a track survives without a match

frame_stride: 1              # process every Nth frame (max_age counts processed frames)

events:
  jsonl: events.jsonl        # append one JSON line per event; null to disable
  webhook_url: null          # e.g. http://localhost:8000/events ; null to disable
  webhook_timeout_s: 3

# ---- Service mode (python -m zone_exit serve) ----
# Each camera has its own zone and may override the rule. 'source' can be a file, a camera index
# or a stream address. Use environment variables for stream addresses that contain passwords.
cameras:
  gate1:
    source: ${GATE1_URL}
    zone_file: zones/gate1.json
    rule:
      direction: left_to_right

api:
  max_sessions: 4            # sessions that may run at the same time
  default_timeout_s: 120     # a session stops after this long if nothing was detected
  retention_s: 600           # how long finished sessions stay queryable
  token_env: ZONE_EXIT_TOKEN # name of the environment variable that holds the API token
